<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Chitya Academy</title>
    <style>
        :root {
            --primary-blue: #0b1c3c;
            --accent-gold: #fdd017;
            --alert-red: #d92027;
            --text-dark: #333333;
            --bg-light: #f8f9fa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-container { background-color: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 450px; border-top: 5px solid var(--accent-gold); }
        .header-section { text-align: center; margin-bottom: 25px; }
        .header-section h2 { color: var(--primary-blue); font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--primary-blue); font-weight: bold; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
        .btn-submit { width: 100%; background-color: var(--primary-blue); color: var(--accent-gold); padding: 12px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.3s; }
        .btn-submit:hover { background-color: #08152d; }
        #message { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="header-section">
            <h2>Reset Password</h2>
            <p style="font-size: 13px; color: #666; margin-top: 5px;">Enter your new secure password below.</p>
        </div>

        <form id="resetForm">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="new-password" placeholder="Enter new password" required>
            </div>
            <button type="submit" class="btn-submit">Update Password</button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const messageBox = document.getElementById('message');

            try {
                const response = await fetch('http://localhost:3000/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await response.json();

                if (response.ok) {
                    messageBox.style.color = '#10b981';
                    messageBox.textContent = data.message + " Redirecting to login...";
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    messageBox.style.color = '#dc2626';
                    messageBox.textContent = data.error;
                }
            } catch (err) {
                messageBox.style.color = '#dc2626';
                messageBox.textContent = "Cannot connect to server.";
            }
        });
    </script>
</body>
</html>
